<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>STRYKER IT LOLLIES</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f8;
    color: #263238;
}

.header {
background: #fbc02d;
color: #000000;
text-align: center;
padding: 25px;
border-bottom: 6px solid #e0a800;
}
``

.header h1 {
margin: 0;
color: #000000;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #ffffff;
    padding: 25px;
    margin-top: 20px;
    border-radius: 18px;
    border: 1px solid #d6dce1;
    box-shadow: 0 5px 20px rgba(0, 0, 0, .10);
}

.hidden {
    display: none !important;
}

button {
    border: none;
    border-radius: 12px;
    padding: 16px 22px;
    margin: 6px;
    font-size: 18px;
    min-height: 55px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

/* BLUE BUTTON */
.primary {
    background: #1565c0;
    color: white;
}

.primary:hover {
    background: #0d47a1;
}

/* YELLOW / SUCCESS */
.success {
    background: #fbc02d;
    color: #263238;
    font-weight: bold;
}

.success:hover {
    background: #f9a825;
}

/* LIGHT GRAY */
.secondary {
background: #e3e8ed;
color: #263238;
min-width: 250px;
padding: 16px 25px;
}

.secondary:hover {
    background: #cfd8dc;
}

/* RED */
.danger {
    background: #d32f2f;
    color: white;
}

.danger:hover {
    background: #b71c1c;
}

input,
textarea,
select {
    width: 100%;
    padding: 15px;
    margin: 8px 0 15px;
    border: 2px solid #cfd8dc;
    border-radius: 10px;
    font-size: 17px;
    background: #ffffff;
    color: #263238;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
}

textarea {
    min-height: 100px;
}

.question {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #263238;
}

.answer {
    display: block;
    width: 100%;
    text-align: left;
    background: #f5f7f9;
    border: 2px solid #cfd8dc;
    color: #263238;
}

.answer:hover {
    background: #fffde7;
    border-color: #fbc02d;
}

.answer.selected {
    background: #fff8c5;
    border-color: #fbc02d;
    color: #263238;
    font-weight: bold;
}

.question-item {
    border: 1px solid #d6dce1;
    background: #f8fafb;
    padding: 18px;
    margin: 12px 0;
    border-radius: 12px;
}

.reward {
    text-align: center;
    border-top: 6px solid #fbc02d;
}

.chocolate {
    font-size: 80px;
}

.score {
    font-size: 42px;
    font-weight: bold;
    color: #1565c0;
}

.center {
    text-align: center;
}

/* YELLOW HIGHLIGHT */
.reward h2 {
    color: #1565c0;
}

/* PROGRESS */
#progress {
    color: #607d8b;
    font-weight: bold;
    background: #f1f3f5;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}

/* MOBILE */
@media (max-width: 600px) {

    .header {
        padding: 20px 15px;
    }

    .header h1 {
        font-size: 25px;
    }

    .container {
        padding: 10px;
    }

    .card {
        padding: 18px;
        margin-top: 12px;
    }

    .question {
        font-size: 22px;
    }

    button {
        font-size: 17px;
        width: calc(100% - 12px);
        margin: 6px;
    }

}

</style></head>

<body>

<div class="header">
    <h1>🪱 STRYKER IT LOLLIES</h1>
    <p>Test your IT knowledge and win chocolate!</p>
</div>


<div class="container">


<!-- =========================
     HOME / CUSTOMER SCREEN
========================= -->

<div id="homeScreen" class="card center">

    <h2>Welcome!</h2>

    <p>
        Answer the IT questions and earn Lollies.
    </p>

    <button
        class="success"
        type="button"
        onclick="startQuiz()">

        🪱 START QUIZ

    </button>

    <br><br>
<button
class="secondary"
style="width:260px;"
type="button"
onclick="window.open('https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=-7udTko5g0WIEFP4H4GeO6OWVUcX96lCrdqkoDLPdMxUMlUyTlkwMVc4Wk1OTjRRN1NUQ0JHRENWWS4u','_blank')">
💡 Suggest a Question
</button>
 
<br><br>
    <button
        class="secondary"
        type="button"
        onclick="openAdminLogin()">

        ⚙️ Admin

    </button>

</div>


<!-- =========================
     ADMIN LOGIN
========================= -->

<div id="adminLoginScreen" class="hidden">

    <div class="card center">

        <h2>🔐 Admin Access</h2>

        <p>Enter your private PIN.</p>

        <input
            type="password"
            id="adminPin"
            placeholder="Enter PIN"
            inputmode="numeric"
            maxlength="6">

        <br>

        <button
            class="primary"
            type="button"
            onclick="checkAdminPin()">

            LOGIN

        </button>

        <button
            class="secondary"
            type="button"
            onclick="goHome()">

            CANCEL

        </button>

        <p id="pinError" style="color:red;"></p>

    </div>

</div>


<!-- =========================
     ADMIN QUESTION MANAGER
========================= -->

<div id="adminScreen" class="hidden">

    <div class="card">

        <h2>⚙️ Question Manager</h2>

        <label>Question</label>

        <textarea
            id="questionText"
            placeholder="Enter your IT question">
        </textarea>


        <label>Answer 1</label>

        <input
            id="answer1"
            placeholder="Answer 1">


        <label>Answer 2</label>

        <input
            id="answer2"
            placeholder="Answer 2">


        <label>Answer 3</label>

        <input
            id="answer3"
            placeholder="Answer 3">


        <label>Answer 4</label>

        <input
            id="answer4"
            placeholder="Answer 4">


        <label>Correct Answer</label>

        <select id="correctAnswer">

            <option value="0">
                Answer 1
            </option>

            <option value="1">
                Answer 2
            </option>

            <option value="2">
                Answer 3
            </option>

            <option value="3">
                Answer 4
            </option>

        </select>


        <button
            class="primary"
            type="button"
            onclick="addQuestion()">

            ➕ ADD QUESTION

        </button>


        <button
            class="secondary"
            type="button"
            onclick="clearForm()">

            CLEAR

        </button>

    </div>


    <div class="card">

        <h2>Your Questions</h2>

        <div id="questionList"></div>

        <button
            class="secondary"
            type="button"
            onclick="goHome()">

            ← HOME

        </button>

    </div>

</div>


<!-- =========================
     QUIZ
========================= -->

<div id="quizScreen" class="hidden">

    <div class="card">

        <div id="progress"></div>

        <br>

        <div
            id="quizQuestion"
            class="question">
        </div>

        <div id="answers"></div>

        <button
            id="nextButton"
            class="primary"
            type="button"
            onclick="nextQuestion()">

            NEXT →

        </button>

    </div>

</div>


<!-- =========================
     RESULT
========================= -->

<div id="resultScreen" class="hidden">

    <div class="card reward">

        <h2>🎉 Congratulations!</h2>

        <div class="chocolate">
            🪱
        </div>

        <p>Your Score</p>

        <div
            id="finalScore"
            class="score">
        </div>

        <h2 id="rewardMessage"></h2>

        <button
            class="success"
            type="button"
            onclick="startQuiz()">

            PLAY AGAIN

        </button>

        <button
            class="secondary"
            type="button"
            onclick="goHome()">

            HOME

        </button>

    </div>

</div>

</div>


<script>

/* ==================================================
   ADMIN PIN
================================================== */

const ADMIN_PIN = "1234";


/* ==================================================
   QUESTIONS
================================================== */

let questions =
    JSON.parse(
        null
    ) || [

    {
        question: "What does CPU stand for?",
        answers: [
            "Central Processing Unit",
            "Computer Personal Unit",
            "Central Program Utility",
            "Computer Processing User"
        ],
        correct: 0
    },

    {
        question: "What does RAM stand for?",
        answers: [
            "Random Access Memory",
            "Read Access Machine",
            "Rapid Application Memory",
            "Random Application Module"
        ],
        correct: 0
    }

];


/* ==================================================
   SAVE QUESTIONS
================================================== */

function saveQuestions() {

    // Persistence is disabled because SharePoint previews run in a sandbox without localStorage.

}


/* ==================================================
   SCREEN MANAGEMENT
================================================== */

function hideAll() {

    document
        .getElementById("homeScreen")
        .classList.add("hidden");

    document
        .getElementById("adminLoginScreen")
        .classList.add("hidden");

    document
        .getElementById("adminScreen")
        .classList.add("hidden");

    document
        .getElementById("quizScreen")
        .classList.add("hidden");

    document
        .getElementById("resultScreen")
        .classList.add("hidden");
}


function goHome() {

    hideAll();

    document
        .getElementById("homeScreen")
        .classList.remove("hidden");

}


/* ==================================================
   ADMIN LOGIN
================================================== */

function openAdminLogin() {

    hideAll();

    document
        .getElementById("adminLoginScreen")
        .classList.remove("hidden");

    document
        .getElementById("adminPin")
        .value = "";

    document
        .getElementById("pinError")
        .textContent = "";

}


function checkAdminPin() {

    const pin =
        document
        .getElementById("adminPin")
        .value;

    if (pin === ADMIN_PIN) {

        showAdmin();

    } else {

        document
            .getElementById("pinError")
            .textContent =
            "Incorrect PIN.";

        document
            .getElementById("adminPin")
            .value = "";

    }

}


/* ==================================================
   ADMIN SCREEN
================================================== */

function showAdmin() {

    hideAll();

    document
        .getElementById("adminScreen")
        .classList.remove("hidden");

    displayQuestions();

}


function addQuestion() {

    const question =
        document
        .getElementById("questionText")
        .value
        .trim();

    const answers = [

        document
        .getElementById("answer1")
        .value
        .trim(),

        document
        .getElementById("answer2")
        .value
        .trim(),

        document
        .getElementById("answer3")
        .value
        .trim(),

        document
        .getElementById("answer4")
        .value
        .trim()

    ];

    const correct =
        Number(
            document
            .getElementById("correctAnswer")
            .value
        );


    if (!question) {

        alert("Enter a question.");

        return;
    }


    if (answers.some(a => !a)) {

        alert("Enter all four answers.");

        return;
    }


    questions.push({

        question: question,
        answers: answers,
        correct: correct

    });


    saveQuestions();

    clearForm();

    displayQuestions();

    alert("Question added!");
}


function clearForm() {

    document
        .getElementById("questionText")
        .value = "";

    document
        .getElementById("answer1")
        .value = "";

    document
        .getElementById("answer2")
        .value = "";

    document
        .getElementById("answer3")
        .value = "";

    document
        .getElementById("answer4")
        .value = "";

}


function displayQuestions() {

    const list =
        document
        .getElementById("questionList");

    list.innerHTML = "";


    questions.forEach(function(q, index) {

        const div =
            document.createElement("div");

        div.className =
            "question-item";


        div.innerHTML = `

            <strong>
                ${index + 1}. ${escapeHTML(q.question)}
            </strong>

            <p>
                A. ${escapeHTML(q.answers[0])}
                ${q.correct === 0 ? " ✅" : ""}
            </p>

            <p>
                B. ${escapeHTML(q.answers[1])}
                ${q.correct === 1 ? " ✅" : ""}
            </p>

            <p>
                C. ${escapeHTML(q.answers[2])}
                ${q.correct === 2 ? " ✅" : ""}
            </p>

            <p>
                D. ${escapeHTML(q.answers[3])}
                ${q.correct === 3 ? " ✅" : ""}
            </p>

            <button
                class="danger"
                type="button"
                onclick="deleteQuestion(${index})">

                DELETE

            </button>
        `;


        list.appendChild(div);

    });

}


function deleteQuestion(index) {

    if (
        confirm("Delete this question?")
    ) {

        questions.splice(index, 1);

        saveQuestions();

        displayQuestions();

    }

}


/* ==================================================
   QUIZ
================================================== */

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;


function startQuiz() {

    if (questions.length === 0) {

        alert("No questions available.");

        return;
    }


    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    hideAll();

    document
        .getElementById("quizScreen")
        .classList.remove("hidden");

    showQuestion();

}


function showQuestion() {

    const q =
        questions[currentQuestion];


    document
        .getElementById("progress")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
        .getElementById("quizQuestion")
        .textContent =
        q.question;


    const answers =
        document
        .getElementById("answers");

    answers.innerHTML = "";

    selectedAnswer = null;


    q.answers.forEach(
        function(answer, index) {

            const button =
                document.createElement("button");

            button.className =
                "answer";

            button.textContent =
                String.fromCharCode(65 + index)
                + ". "
                + answer;


            button.onclick =
                function() {

                    selectAnswer(
                        index,
                        button
                    );

                };


            answers.appendChild(button);

        }
    );


    document
        .getElementById("nextButton")
        .textContent =
        currentQuestion === questions.length - 1
        ? "FINISH 🎉"
        : "NEXT →";

}


function selectAnswer(index, button) {

    selectedAnswer = index;


    document
        .querySelectorAll(".answer")
        .forEach(function(btn) {

            btn.classList.remove("selected");

        });


    button.classList.add("selected");

}


function nextQuestion() {

    if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;
    }


    if (
        selectedAnswer ===
        questions[currentQuestion].correct
    ) {

        score++;

    }


    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

    } else {

        showQuestion();

    }

}


/* ==================================================
   RESULT
================================================== */

function showResult() {

    hideAll();

    document
        .getElementById("resultScreen")
        .classList.remove("hidden");


    document
        .getElementById("finalScore")
        .textContent =
        score + " / " + questions.length;


    const percentage =
        (score / questions.length) * 100;


    let message;


    if (percentage === 100) {

        message =
            "🏆 IT Master! Premium Lollies! 🪱";

    } else if (percentage >= 70) {

        message =
            "🌟 IT Expert! Enjoy your Lollies! 🪱";

    } else if (percentage >= 40) {

        message =
            "👍 Good job! Enjoy your Lollies! 🪱";

    } else {

        message =
            "😊 Nice try! Enjoy your Lollies! 🪱";

    }


    document
        .getElementById("rewardMessage")
        .textContent = message;

}


/* ==================================================
   HTML SECURITY
================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
